# Builds the phone version of Book Journal and publishes it as a web page (GitHub Pages) each time a version tag (v0.2.0, ...) is pushed.
# Needs GitHub Pages switched on: repository Settings > Pages > Source: "GitHub Actions". You can also run it by hand from the Actions tab.
name: Phone web app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: phone-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:phone
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-phone
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
