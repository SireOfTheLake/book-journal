# Builds the phone version of Book Journal and publishes it to the gh-pages branch each time a version tag (v0.2.0, ...) is pushed.
# GitHub Pages serves that branch: repository Settings > Pages > Source: "Deploy from a branch", branch "gh-pages", folder "/ (root)".
# You can also run it by hand from the Actions tab.
name: Phone web app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phone-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:phone
      - name: Publish dist-phone to the gh-pages branch
        run: |
          cd dist-phone
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Phone app from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
