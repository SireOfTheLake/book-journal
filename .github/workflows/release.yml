# Builds the Windows installer and publishes it as a GitHub release when a version tag (v0.2.0, ...) is pushed.
# The app checks that release for updates and shows the "Update and restart" notice.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: node scripts/write-build-config.mjs --sign
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Book Journal ${{ github.ref_name }}'
          releaseBody: 'Book Journal installer. Installed copies offer this update by themselves.'
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.extra.json
